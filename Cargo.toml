[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/k0-arch",
    "crates/k0-mm",
    "crates/k0-cap",
    "crates/k0-ipc",
    "crates/k0-sched",
    "crates/k0-task",
    "crates/k0-boot",
    "crates/k0-abi",
    "crates/k0-efi",
    "crates/k0-conin",
    "userspace/root-task",
    "userspace/k0-vault",
    "userspace/k0-term",
    "loader",
]
# UEFI 로더는 타겟이 달라(aarch64-unknown-uefi) 기본 빌드 대상에서 뺌.
# tools/build-loader.sh로 빌드함
default-members = [
    "kernel",
    "crates/k0-arch",
    "crates/k0-mm",
    "crates/k0-cap",
    "crates/k0-ipc",
    "crates/k0-sched",
    "crates/k0-task",
    "crates/k0-boot",
    "crates/k0-abi",
    "crates/k0-efi",
    "crates/k0-conin",
    "userspace/root-task",
]

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
version = "0.1.0"

# 커널은 unwind 불가능
[profile.dev]
panic = "abort" # fail-secure 핸들러로

[profile.release]
panic = "abort"
opt-level = 2
lto = "fat"
codegen-units = 1 # 재현 가능 빌드 + 최적화 일관성
overflow-checks = true # release에서도 정수 오버플로는 panic
debug-assertions = false
strip = false # 감사(audit) 때메
