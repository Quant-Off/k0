# 커널은 softfloat 타겟으로 빌드(seL4 식)
[build]
target = "aarch64-unknown-none-softfloat"

# 링커 스크립트는 여기서 지정하지 않습니다.
# 그래뉼에 따라 정렬이 달라지므로 kernel/build.rs가 그래뉼 feature
# (granule-4k / granule-16k)를 보고 스크립트를 생성해 -T로 주입합니다.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
]
# `cargo run` = QEMU virt에서 즉시 부팅 테스트
# 스크립트가 ELF -> raw Image 변환 후 부팅합니다. (x0=DTB 전달을 위해 필수)
runner = "tools/qemu-virt-runner.sh"

# 빌드 진입점
# cargo virt -> QEMU virt 빌드 + 부팅
# 입출력은 선택 기능이므로 콘솔 feature를 붙여야 직렬 포트에 출력이 나옵니다
# (붙이지 않으면 UART 코드가 없는 조용한 커널이 부팅됨)
[alias]
virt = "run -p k0-kernel --features console"

# vendor 디렉토리에서만 의존성을 해석
[source.crates-io]
replace-with = "vendored-sources"
[source.vendored-sources]
directory = "vendor"
