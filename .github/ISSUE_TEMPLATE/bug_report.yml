name: Bug report
description: Something in K0 behaves differently from what the code or documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. Follow SECURITY.md and report them privately.
        The isolation gaps listed in SECURITY.md are already known.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - QEMU virt
        - Another QEMU machine
        - Hypervisor guest (KVM or HVF)
        - Real board
        - Host unit tests
        - Other
    validations:
      required: true
  - type: dropdown
    id: boot-path
    attributes:
      label: Boot path
      description: How the kernel was started. The UEFI loader is built by `tools/build-loader.sh`.
      options:
        - Directly (QEMU -kernel with the kernel Image, or a boot loader that passes a device tree)
        - Through the K0 UEFI loader
        - Not applicable (host unit tests)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware build
      description: Only for the UEFI loader. Firmware name and version, for example `qemu-efi-aarch64 2022.11` or Homebrew EDK2 `stable202408`, the QEMU version, and whether the firmware gave a device tree or only ACPI tables (the loader prints `device tree built from ACPI tables` in the second case).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, QEMU arguments, a DTB, or a root task change that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Boot log or test output
      render: text
  - type: checkboxes
    id: not-security
    attributes:
      label: Scope
      options:
        - label: This is not a security vulnerability.
          required: true
