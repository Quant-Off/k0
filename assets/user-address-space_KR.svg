<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="title desc">
  <title id="title">태스크의 사용자 주소 공간</title>
  <desc id="desc">태스크가 매핑할 수 있는 프레임과 권한, 부트 때 만드는 배치, EL0가 닿을 수 없는 영역, 물리 프레임 단위 W^X.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .kernel { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .user { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .ext { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .warn { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 15px; fill: #1f2328; }
    .h { font-weight: 600; font-size: 16px; }
    .s { font-size: 13px; fill: #57606a; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #1f2328; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .off { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="571" rx="10"/>
  <text class="t h" x="30" y="38">MAP으로 매핑할 수 있는 것</text>
  <text class="t s" x="46" y="70">권한</text>
  <text class="t s" x="130" y="70">필요한 rights</text>
  <text class="t s" x="270" y="70">결과 매핑</text>
  <text class="t s" x="360" y="70">EL0</text>
  <rect class="user" x="30" y="82" width="450" height="40" rx="8"/>
  <text class="m" x="46" y="108">RO</text>
  <text class="t" x="130" y="108">R</text>
  <text class="m" x="270" y="108">RoUser</text>
  <text class="t s" x="360" y="108">읽기</text>
  <rect class="user" x="30" y="130" width="450" height="40" rx="8"/>
  <text class="m" x="46" y="156">RW</text>
  <text class="t" x="130" y="156">R과 W</text>
  <text class="m" x="270" y="156">RwUser</text>
  <text class="t s" x="360" y="156">읽기, 쓰기</text>
  <rect class="user" x="30" y="178" width="450" height="40" rx="8"/>
  <text class="m" x="46" y="204">RX</text>
  <text class="t" x="130" y="204">R과 X</text>
  <text class="m" x="270" y="204">TextUser</text>
  <text class="t s" x="360" y="204">읽기, 실행</text>
  <rect class="kernel" x="30" y="234" width="450" height="150" rx="8"/>
  <text class="t h" x="46" y="260">물리 프레임 단위 W^X</text>
  <text class="t s" x="46" y="284">쓸 수 있는 프레임에는 RX를 허용하는 케이퍼빌리티가 없음</text>
  <text class="t s" x="46" y="304">실행할 수 있는 프레임에는 RW를 허용하는 케이퍼빌리티가 없음</text>
  <text class="t s" x="46" y="324">RETYPE으로 만든 프레임은 R과 W만 받고 X는 못 받음</text>
  <text class="t s" x="46" y="344">X는 루트 태스크 자신의 text 프레임에만, W 없이</text>
  <text class="t" x="46" y="372">부팅 이후 새 실행 코드는 적재할 수 없음</text>
  <rect class="warn" x="30" y="396" width="450" height="160" rx="8"/>
  <text class="t h" x="46" y="422">EL0가 닿을 수 없는 것</text>
  <text class="t s" x="46" y="448">커널 오브젝트는 보이지 않음: BAD_CAP</text>
  <text class="t s" x="46" y="472">커널 text와 위쪽 절반: 접근하면 폴트</text>
  <text class="t s" x="46" y="496">첫 번째 그래뉼: 매핑 없음, null 접근은 폴트</text>
  <text class="t s" x="46" y="520">48비트 사용자 절반 너머: BAD_VA</text>
  <text class="t s" x="46" y="544">커널은 사용자 메모리를 실행하지 않음: PXN</text>
  <text class="t h" x="510" y="38">spawn_root이 만드는 배치</text>
  <rect class="warn" x="510" y="56" width="420" height="46" rx="8"/>
  <text class="t" x="526" y="76">48비트 사용자 절반 너머</text>
  <text class="m" x="526" y="94">BAD_VA</text>
  <rect class="user" x="510" y="112" width="420" height="70" rx="8"/>
  <text class="t h" x="526" y="136">스택, RwUser</text>
  <text class="t s" x="526" y="158">64 KiB, 바로 아래</text>
  <text class="m" x="680" y="158">0x1000_0000</text>
  <rect class="warn" x="510" y="192" width="420" height="46" rx="8"/>
  <text class="t" x="526" y="212">스택 아래의 가드 그래뉼</text>
  <text class="t s" x="526" y="230">매핑하지 않은 채 둠</text>
  <rect class="user" x="510" y="248" width="420" height="70" rx="8"/>
  <text class="t h" x="526" y="272">bootinfo 페이지, RoUser</text>
  <text class="t s" x="526" y="294">읽기 전용,</text>
  <text class="m" x="615" y="294">0x0F00_0000</text>
  <rect class="user" x="510" y="328" width="420" height="104" rx="8"/>
  <text class="t h" x="526" y="352">루트 태스크 이미지 세그먼트</text>
  <text class="t s" x="526" y="374">빌드 시점 메타데이터에 따라 매핑</text>
  <text class="t s" x="526" y="394">코드는 TextUser, 읽기 전용 데이터는 RoUser</text>
  <text class="t s" x="526" y="414">데이터는 RwUser, 각각 그래뉼 경계에서 시작</text>
  <rect class="warn" x="510" y="442" width="420" height="70" rx="8"/>
  <text class="t h" x="526" y="466">첫 번째 그래뉼</text>
  <text class="t s" x="526" y="488">절대 매핑하지 않음: null 포인터 역참조는 항상 폴트</text>
</svg>
