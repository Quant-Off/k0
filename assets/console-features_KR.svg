<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">콘솔 feature에 따른 출력 경로</title>
  <desc id="desc">feature 없이 빌드한 이미지는 메모리의 부트 로그에만 출력하고, 콘솔 feature로 빌드한 이미지는 해당 UART에도 출력합니다.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .kernel { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .user { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .ext { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .warn { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 15px; fill: #1f2328; }
    .h { font-weight: 600; font-size: 16px; }
    .s { font-size: 13px; fill: #57606a; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #1f2328; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .off { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="429" rx="10"/>

  <text class="t h" x="30" y="38">빌드에 포함한 feature</text>
  <text class="t h" x="430" y="38">커널 이미지에 들어가는 것</text>
  <text class="t h" x="760" y="38">출력이 닿는 곳</text>

  <rect class="box" x="30" y="60" width="330" height="60" rx="8"/>
  <text class="t h" x="46" y="86">(없음)</text>
  <text class="m" x="46" y="108">cargo build -p k0-kernel</text>

  <rect class="box" x="30" y="150" width="330" height="60" rx="8"/>
  <text class="m" x="46" y="176">console-pl011</text>
  <text class="t s" x="46" y="198">PL011과 SBSA UART</text>

  <rect class="box" x="30" y="240" width="330" height="60" rx="8"/>
  <text class="m" x="46" y="266">console-16550</text>
  <text class="t s" x="46" y="288">16550 계열</text>

  <rect class="box" x="30" y="330" width="330" height="60" rx="8"/>
  <text class="m" x="46" y="356">console</text>
  <text class="t s" x="46" y="378">위의 두 드라이버 모두</text>

  <rect class="kernel" x="430" y="60" width="250" height="60" rx="8"/>
  <text class="t" x="446" y="86">UART 드라이버 없음</text>
  <text class="t s" x="446" y="108">콘솔 페이지를 매핑하지 않음</text>

  <rect class="kernel" x="430" y="150" width="250" height="60" rx="8"/>
  <text class="t" x="446" y="186">PL011 송신 드라이버</text>

  <rect class="kernel" x="430" y="240" width="250" height="60" rx="8"/>
  <text class="t" x="446" y="276">16550 송신 드라이버</text>

  <rect class="kernel" x="430" y="330" width="250" height="60" rx="8"/>
  <text class="t" x="446" y="366">두 송신 드라이버</text>

  <rect class="user" x="760" y="60" width="170" height="60" rx="8"/>
  <text class="t h" x="776" y="86">부트 로그</text>
  <text class="t s" x="776" y="108">커널 메모리, 16 KiB</text>

  <rect class="ext" x="760" y="240" width="170" height="60" rx="8"/>
  <text class="t h" x="776" y="266">콘솔 UART</text>
  <text class="t s" x="776" y="288">기계 밖으로 나감</text>

  <path class="line" d="M 360 90 H 428" marker-end="url(#arrow)"/>
  <path class="line" d="M 360 180 H 428" marker-end="url(#arrow)"/>
  <path class="line" d="M 360 270 H 428" marker-end="url(#arrow)"/>
  <path class="line" d="M 360 360 H 428" marker-end="url(#arrow)"/>

  <path class="line" d="M 680 90 H 758" marker-end="url(#arrow)"/>
  <path class="line" d="M 680 180 C 720 180, 720 262, 758 262" marker-end="url(#arrow)"/>
  <path class="line" d="M 680 270 H 758" marker-end="url(#arrow)"/>
  <path class="line" d="M 680 360 C 720 360, 720 278, 758 278" marker-end="url(#arrow)"/>

  <text class="t s" x="760" y="150">모든 이미지가 여기에 기록</text>
  <text class="t s" x="760" y="330">드라이버가 맞는 콘솔일 때만</text>
</svg>
