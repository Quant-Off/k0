<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc">
  <title id="title">부팅 단계</title>
  <desc id="desc">진입 규약에서 시작해 boot.S, kernel_init, kernel_main을 거쳐 루트 태스크가 EL0에서 실행되기까지의 순서입니다.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .kernel { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .user { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .ext { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .warn { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 15px; fill: #1f2328; }
    .h { font-weight: 600; font-size: 16px; }
    .s { font-size: 13px; fill: #57606a; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #1f2328; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .off { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="659" rx="10"/>

  <rect class="ext" x="30" y="50" width="200" height="170" rx="8"/>
  <text class="t h" x="46" y="80">진입 규약</text>
  <text class="t s" x="46" y="106">Linux arm64 Image</text>
  <text class="t s" x="46" y="128">x0 = DTB 물리 주소</text>
  <text class="t s" x="46" y="150">MMU와 데이터 캐시 꺼짐</text>
  <text class="t s" x="46" y="172">EL1 또는 EL2</text>
  <rect class="kernel" x="260" y="50" width="330" height="170" rx="8"/>
  <text class="t h" x="276" y="80">페이즈 0: boot.S</text>
  <text class="t" x="276" y="108">1 모든 예외를 마스크</text>
  <text class="t" x="276" y="130">2 적재 주소와 예외 레벨 확인</text>
  <text class="t" x="276" y="152">3 EL2에서 EL1으로 내려감</text>
  <text class="t" x="276" y="174">4 EL1을 정규화</text>
  <text class="t" x="276" y="196">5 부트 스택, .bss, kernel_init(x0)</text>
  <rect class="kernel" x="620" y="50" width="310" height="170" rx="8"/>
  <text class="t h" x="636" y="80">kernel_init</text>
  <text class="t s" x="636" y="100">물리 적재 주소에서 실행, MMU 꺼짐</text>
  <text class="t" x="636" y="128">1 예외 벡터 설치</text>
  <text class="t" x="636" y="152">2 MMU 켜기 (enable_paging)</text>
  <text class="t" x="636" y="176">3 higher-half로 점프</text>
  <path class="line" d="M 230 135 H 258" marker-end="url(#arrow)"/>
  <path class="line" d="M 590 135 H 618" marker-end="url(#arrow)"/>
  <path class="line" d="M 775 220 V 258" marker-end="url(#arrow)"/>
  <text class="t s" x="787" y="244">점프 (x0 = DTB)</text>
  <rect class="kernel" x="30" y="260" width="900" height="282" rx="8"/>
  <text class="t h" x="46" y="290">kernel_main</text>
  <text class="t s" x="170" y="290">higher-half에서 실행, 로그 줄의 순서가 단계의 순서입니다</text>
  <text class="t s" x="46" y="326">1</text>
  <text class="m" x="70" y="326">k0: higher half (pc = ...)</text>
  <text class="t s" x="46" y="350">2</text>
  <text class="m" x="70" y="350">k0: w^x checks pass (granule 4K, wxn)</text>
  <text class="t s" x="46" y="374">3</text>
  <text class="m" x="70" y="374">k0: dtb rejected: ...</text>
  <text class="t s" x="258" y="374">(실패할 때만)</text>
  <text class="t s" x="46" y="398">4</text>
  <text class="m" x="70" y="398">k0: memory ...</text>
  <text class="t s" x="46" y="422">5</text>
  <text class="m" x="70" y="422">k0: console drivers [...]</text>
  <text class="t s" x="46" y="446">6</text>
  <text class="m" x="70" y="446">k0: platform ...</text>
  <text class="t s" x="46" y="470">7</text>
  <text class="m" x="70" y="470">k0: root task integrity ok (...)</text>
  <text class="t s" x="46" y="494">8</text>
  <text class="m" x="70" y="494">k0: entropy ...</text>
  <text class="t s" x="46" y="518">9</text>
  <text class="m" x="70" y="518">k0: pac=... bti=... pan=...</text>
  <text class="t s" x="486" y="326">10</text>
  <text class="m" x="510" y="326">k0: irq on (timer 1s)</text>
  <text class="t s" x="486" y="350">11</text>
  <text class="m" x="510" y="350">k0: kernel table pool N/40</text>
  <text class="t s" x="486" y="374">12</text>
  <text class="m" x="510" y="374">k0: root task loaded (entry ...)</text>
  <text class="t s" x="486" y="398">13</text>
  <text class="m" x="510" y="398">k0: untyped ...</text>
  <text class="t s" x="486" y="422">14</text>
  <text class="m" x="510" y="422">k0: root cnode ready (...)</text>
  <text class="t s" x="486" y="446">15</text>
  <text class="m" x="510" y="446">k0: bootinfo page ready</text>
  <text class="t s" x="486" y="470">16</text>
  <text class="m" x="510" y="470">k0: user w^x checks pass</text>
  <text class="t s" x="486" y="494">17</text>
  <text class="m" x="510" y="494">k0: device pages [...] of 0x1000 bytes</text>
  <text class="t s" x="486" y="518">18</text>
  <text class="m" x="510" y="518">k0: entering root task (el0)</text>
  <path class="line" d="M 250 542 V 578" marker-end="url(#arrow)"/>
  <rect class="kernel" x="30" y="580" width="440" height="60" rx="8"/>
  <text class="t h" x="46" y="606">이양: handoff, enter_user</text>
  <text class="t s" x="46" y="628">모든 예외를 마스크한 뒤 EL0로 복귀</text>
  <path class="line" d="M 470 610 H 538" marker-end="url(#arrow)"/>
  <rect class="user" x="540" y="580" width="390" height="60" rx="8"/>
  <text class="t h" x="556" y="606">루트 태스크</text>
  <text class="t s" x="556" y="628">EL0에서 실행</text>
</svg>
