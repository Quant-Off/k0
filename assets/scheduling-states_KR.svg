<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">태스크 상태와 전환</title>
  <desc id="desc">Inactive에서 TCB_CONFIGURE로 Stopped, TCB_RESUME으로 Ready가 되고, 라운드 로빈으로 Running과 Ready를 오가며, IPC에서 블록되었다가 상대가 해제하거나 기한이 지나면 Ready가 되고, 어느 상태에서든 정리되면 Dead가 됩니다.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .kernel { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .user { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .ext { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .warn { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 15px; fill: #1f2328; }
    .h { font-weight: 600; font-size: 16px; }
    .s { font-size: 13px; fill: #57606a; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #1f2328; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .off { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="439" rx="10"/>

  <rect class="box" x="30" y="80" width="120" height="52" rx="8"/>
  <text class="m" x="90" y="111" text-anchor="middle">Inactive</text>
  <rect class="box" x="290" y="80" width="120" height="52" rx="8"/>
  <text class="m" x="350" y="111" text-anchor="middle">Stopped</text>
  <rect class="user" x="510" y="80" width="120" height="52" rx="8"/>
  <text class="m" x="570" y="111" text-anchor="middle">Ready</text>
  <rect class="kernel" x="780" y="80" width="120" height="52" rx="8"/>
  <text class="m" x="840" y="111" text-anchor="middle">Running</text>
  <line class="line" x1="152" y1="106" x2="288" y2="106" marker-end="url(#arrow)"/>
  <text class="t s" x="220" y="98" text-anchor="middle">TCB_CONFIGURE</text>
  <line class="line" x1="412" y1="106" x2="508" y2="106" marker-end="url(#arrow)"/>
  <text class="t s" x="460" y="98" text-anchor="middle">TCB_RESUME</text>
  <line class="line" x1="632" y1="106" x2="778" y2="106" marker-end="url(#arrow)"/>
  <text class="t s" x="705" y="98" text-anchor="middle">다음 태스크로 전환</text>
  <line class="line" x1="840" y1="78" x2="840" y2="50"/>
  <line class="line" x1="840" y1="50" x2="570" y2="50"/>
  <line class="line" x1="570" y1="50" x2="570" y2="78" marker-end="url(#arrow)"/>
  <text class="t s" x="705" y="42" text-anchor="middle">YIELD, 타이머 선점 (rotate)</text>
  <rect class="ext" x="470" y="230" width="440" height="64" rx="8"/>
  <text class="m" x="490" y="256">BlockedSend  BlockedRecv  BlockedCall</text>
  <text class="m" x="490" y="280">BlockedReply</text>
  <line class="line" x1="840" y1="134" x2="840" y2="228" marker-end="url(#arrow)"/>
  <text class="t s" x="830" y="190" text-anchor="end">IPC에서 블록</text>
  <line class="line" x1="530" y1="228" x2="530" y2="134" marker-end="url(#arrow)"/>
  <text class="t s" x="520" y="160" text-anchor="end">상대가 해제</text>
  <line class="line" x1="610" y1="228" x2="610" y2="134" marker-end="url(#arrow)"/>
  <text class="t s" x="620" y="160">기한 경과 (타임아웃)</text>
  <rect class="warn" x="30" y="340" width="400" height="80" rx="8"/>
  <text class="m" x="46" y="366">Dead</text>
  <text class="t s" x="46" y="388">EXIT, EL0 폴트, 알 수 없는 시스템 콜,</text>
  <text class="t s" x="46" y="406">원본 케이퍼빌리티 제거 (정리)</text>
  <line class="line" x1="90" y1="134" x2="90" y2="338" marker-end="url(#arrow)"/>
  <text class="t s" x="100" y="240">어느 상태에서나</text>
  <text class="t s" x="470" y="385">부트의 handoff로 루트 태스크가 첫 Running 태스크가 됩니다.</text>
</svg>
