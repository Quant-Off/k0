[package]
name = "k0-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 그래뉼 선택: build.rs가 링커 스크립트의 정렬을 맞추고 잘못된 조합은 빌드 실패
[features]
default = ["granule-4k"]
granule-4k = [
    "k0-ipc/granule-4k",
    "k0-mm/granule-4k",
    "k0-task/granule-4k",
    "k0-sched/granule-4k",
]
granule-16k = [
    "k0-ipc/granule-16k",
    "k0-mm/granule-16k",
    "k0-task/granule-16k",
    "k0-sched/granule-16k",
]

# 입출력 선택: 기본 빌드에는 입출력 feature가 하나도 없음
# 고르지 않으면 커널은 UART를 매핑하지도 건드리지도 않고, 모든 출력은 메모리의
# 부트 로그에만 남음. feature는 더하는 방향으로만 정의하고, `default`에는 넣지
# 않음(`--no-default-features`로 빌드하는 16K 이미지에서 조용히 빠지지 않게
# 스크립트와 CI가 항상 명시함). 새 입출력 경로는 처음부터 feature 뒤에 둠
#   console-pl011  PL011과 SBSA UART 송신 드라이버
#   console-16550  16550 계열 송신 드라이버(식별 레지스터가 없어 확인 불가)
#   console        위 둘 다
console-pl011 = ["k0-arch/console-pl011"]
console-16550 = ["k0-arch/console-16550"]
console = ["console-pl011", "console-16550"]
# 루트 태스크 이미지에 키 볼트(서명 오라클)를 넣음. 알고리즘은 따로 더함
#   vault          볼트 서비스와 그 자가 검증(서명 알고리즘 없음)
#   vault-ed25519  위에 Ed25519를 더함
vault = ["k0-boot/vault"]
vault-ed25519 = ["vault", "k0-boot/vault-ed25519"]

# 커널 크레이트는 외부(third-party) 의존성 0, 워크스페이스 크레이트만 허용
# 외부가 필요해진 경우: vendored + 해시 고정
[dependencies]
k0-abi = { path = "../crates/k0-abi" }
k0-arch = { path = "../crates/k0-arch" }
k0-boot = { path = "../crates/k0-boot" }
k0-cap = { path = "../crates/k0-cap" }
k0-ipc = { path = "../crates/k0-ipc", default-features = false }
k0-mm = { path = "../crates/k0-mm", default-features = false }
k0-sched = { path = "../crates/k0-sched", default-features = false }
k0-task = { path = "../crates/k0-task", default-features = false }

[build-dependencies]
k0-abi = { path = "../crates/k0-abi" }
