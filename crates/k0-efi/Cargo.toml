[package]
name = "k0-efi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# UEFI 로더의 순수 로직. 루트 태스크는 싣지 않으므로 k0-boot의 기본 feature를 끔
[dependencies]
k0-abi = { path = "../k0-abi" }
k0-boot = { path = "../k0-boot", default-features = false }

[dev-dependencies]
k0-boot = { path = "../k0-boot", default-features = false, features = ["test-support"] }
