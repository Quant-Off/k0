[package]
name = "k0-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["roottask"]
# 루트 태스크 이미지를 빌드해 내장함. 커널이 씀
roottask = []
# 루트 태스크 이미지에 키 볼트(서명 오라클)를 넣음. build.rs가 이 feature를
# 보고 루트 태스크의 빌드에 같은 이름의 feature를 넘김
vault = ["roottask"]
vault-ed25519 = ["vault"]
# 콘솔 입력: 루트 태스크의 자가 검증에 입력 시스템 콜의 시험을 넣음
console-input = ["roottask"]
# 운영자 터미널: 자가 검증 뒤에 서비스(볼트가 있으면 볼트와 터미널)를 시작함
terminal = ["console-input"]
# 테스트용 DTB 빌더와 퍼즈 도우미를 다른 크레이트의 테스트에 공개함(std 필요)
test-support = []

[dependencies]
sha2 = { version = "0.10.9", default-features = false }

[build-dependencies]
sha2 = { version = "0.10.9", default-features = false }
