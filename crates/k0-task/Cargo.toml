[package]
name = "k0-task"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 그래뉼 feature는 k0-kernel이 전달하고 여기서는 하위 크레이트로 중계만 함
# default는 워크스페이스 전체 빌드가 깨지지 않게 하기 위한 것
[features]
default = ["granule-4k"]
granule-4k = ["k0-mm/granule-4k"]
granule-16k = ["k0-mm/granule-16k"]

[dependencies]
k0-abi = { path = "../k0-abi" }
k0-arch = { path = "../k0-arch" }
k0-cap = { path = "../k0-cap" }
k0-mm = { path = "../k0-mm", default-features = false }
