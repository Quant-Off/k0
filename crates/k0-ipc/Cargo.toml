[package]
name = "k0-ipc"
version = "1.0.0"
edition.workspace = true
license.workspace = true

# 플랫폼 feature는 k0-kernel이 전달하고 여기서는 하위 크레이트로 중계만 함
# default는 워크스페이스 전체 빌드가 깨지지 않게 하기 위한 것
[features]
default = ["plat-virt"]
plat-virt = ["k0-arch/plat-virt", "k0-mm/plat-virt", "k0-task/plat-virt", "k0-sched/plat-virt"]
plat-apple = ["k0-arch/plat-apple", "k0-mm/plat-apple", "k0-task/plat-apple", "k0-sched/plat-apple"]

[dependencies]
k0-abi = { path = "../k0-abi" }
k0-arch = { path = "../k0-arch", default-features = false }
k0-cap = { path = "../k0-cap" }
k0-mm = { path = "../k0-mm", default-features = false }
k0-sched = { path = "../k0-sched", default-features = false }
k0-task = { path = "../k0-task", default-features = false }
