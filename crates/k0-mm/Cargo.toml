[package]
name = "k0-mm"
version = "1.0.0"
edition.workspace = true
license.workspace = true

# 플랫폼 feature는 k0-kernel이 맡고, 그래뉼(4K/16K)이 여기서 나뉘어짐
# default는 워크스페이스 전체 빌드가 깨지지 않게 하기 위한 것
[features]
default = ["plat-virt"]
plat-virt = []
plat-apple = []

[dependencies]
k0-abi = { path = "../k0-abi" }
