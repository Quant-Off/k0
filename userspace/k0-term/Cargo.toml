[package]
name = "k0-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `vault`를 주면 볼트 프로토콜의 값을 터미널의 타입으로 옮기는 모듈이 들어감.
# 주지 않으면 이 크레이트는 볼트를 전혀 모름
[features]
vault = ["dep:k0-vault"]

[dependencies]
k0-vault = { path = "../k0-vault", optional = true }
